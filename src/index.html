<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Dominó</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Contador de puntos para dominó en dos equipos." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0E1114" />
    <!-- Decides light or dark before the first paint, so a saved choice never flashes the other. -->
    <script>
      (function () {
        var scheme = 'dark';
        try {
          var choice = localStorage.getItem('domino/appearance/v1');
          scheme =
            choice === 'light' || choice === 'dark'
              ? choice
              : matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
        } catch (error) {}
        document.documentElement.dataset.scheme = scheme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', scheme === 'light' ? '#F1F2F4' : '#0E1114');
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dominó" />
    <link rel="icon" type="image/png" sizes="48x48" href="icons/icon-48.png" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Activa JavaScript para usar el contador.</noscript>
  </body>
</html>

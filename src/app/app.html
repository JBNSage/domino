<h1 class="sr-only">Dominó</h1>
<!-- Under Inicio the board stays mounted, so the start of a match plays on it, but out of reach. -->
<main #board class="board" tabindex="-1" [attr.inert]="store.atHome() ? '' : null">
  <app-target-header
    [target]="store.state().target"
    (editTarget)="store.canScore() && settings.open('target')"
    (menu)="menu.open()"
    (table)="standings.open()"
    (tables)="tables.open()"
  />
  <app-team-lockup (pressTeam)="store.canScore() && points.open($event)" />
  <div class="body">
    <app-score-list (edit)="points.openEdit($event.row, $event.index)" />
    <app-undo-snackbar (restored)="afterUndo($event)" />
  </div>
  <!-- Only watching: the bar stays in view, out of reach. -->
  <app-quick-add-bar
    class="quick"
    [class.watching]="!store.canScore()"
    [attr.inert]="store.canScore() ? null : ''"
    (enter)="points.open($event)"
    (editQuick)="settings.open('quick')"
  />
</main>

@if (store.atHome()) {
  <app-home-screen
    animate.leave="leaving"
    (menu)="menu.open()"
    (tables)="tables.open()"
    (custom)="matchSetup.open()"
    (tournament)="setup.open()"
  />
}

<app-menu-sheet
  #menu
  (tournament)="store.tournament() === null ? setup.open() : standings.open()"
  (history)="history.open()"
  (stats)="stats.open()"
  (tables)="tables.open()"
  (editTeam)="editSide($event)"
  (reset)="reset.open()"
  (home)="store.goHome()"
  (editMe)="editMe()"
/>
<app-name-sheet #nameSheet />
<app-points-sheet #points />
<app-settings-sheet #settings />
<app-reset-sheet #reset (table)="standings.open()" />

<app-history-screen
  #history
  (openMatch)="match.open($event)"
  (openTournament)="record.open($event)"
/>
<app-tournament-record-screen #record (openMatch)="match.open($event)" />
<app-match-screen #match />

<app-stats-screen #stats (openPlayer)="playerStats.open($event)" />
<app-player-stats-screen #playerStats />

<app-tables-screen #tables (edit)="mesa.open($event)" (joinLink)="joinLink.open()" />
<app-join-link-sheet #joinLink (chosen)="openJoin($event)" />
<app-table-screen
  #mesa
  (editTeam)="team.open($event)"
  (openShare)="share.open($event)"
  (played)="tables.close()"
/>
<app-share-screen #share />
<app-join-screen (rename)="editMe()" (joined)="tables.close()" />

<app-match-setup-screen
  #matchSetup
  (editSide)="editSide($event)"
  (editValue)="settings.open($event)"
/>
<app-tournament-setup-screen #setup (editTeam)="team.open($event)" />
<app-next-match-screen
  (table)="standings.open()"
  (setup)="setup.open()"
  (editTeam)="team.open($event)"
/>
<app-standings-screen #standings />
<app-champion-screen />

<app-seat-sheet #seat (editTeam)="team.open($event)" />
<app-team-sheet #team />
<app-winner-modal (openSettings)="settings.open('target')" />

<p class="sr-only" role="status">{{ store.announcement() }}</p>
